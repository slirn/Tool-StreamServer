name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skills structure check
        run: node scripts/sync-skills.mjs --ci

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install ffmpeg (e2e 依赖：HLS 切片/推流由外部 ffmpeg 完成)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Lint
        run: npm run lint

      # build 必须在 test 前：e2e 依赖 dist/ 产物（干净 checkout 上无残留）
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Commitlint (PR)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD
